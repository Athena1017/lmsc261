<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const w = canvas.width, h = canvas.height;

const dpr = window.devicePixelRatio || 1;
canvas.width *= dpr, canvas.height *= dpr;
ctx.scale(dpr, dpr);

// paint background color
ctx.fillStyle = "lightblue";
ctx.fillRect(0, 0, w, h / 2);
ctx.fillStyle = "lightgreen";
ctx.fillRect(0, h / 2, w, h / 2);

// create variables for coordinates
const cx = w / 2, cy = h / 2;
const centerRadius = w * 0.2;


// draw stick
ctx.beginPath();
ctx.rect(cx - 10,
         cy - 10,
         20,
         200);
ctx.fillStyle = "#f5f5f5";
ctx.fill();


// draw candy body
ctx.beginPath();
ctx.arc(cx,
        cy - 100,
        centerRadius,
        0,
        Math.PI * 2,
        false);
ctx.fillStyle = "#ffff5a";
ctx.fill();


// draw swirl
const numCircles = 9;
const radiusIncr = centerRadius / numCircles;
const colors = [
  "#EF998D",
  "#F0AA75",
  "#EEBB61",
  "#E8776B",
  "#E678B2",
  "#C184D1",
  "#77B1B6",
  "#65D0A0",
  "#66D69E"
];

for (let i = 0; i < numCircles; i++) {
  let radius = radiusIncr * (i + 1);

    ctx.beginPath();
    ctx.arc(
	    cx, 
	    cy - 100,
	    radius, 
	    0, 
	    Math.PI * 2, 
	    false 
);

ctx.strokeStyle = colors[i % colors.length];
ctx.lineWidth = 5;
ctx.stroke();
ctx.lineclip = "round";
}



</script>
